name: Render Backend Keep-Alive

on:
  schedule:
    # Runs every 12 minutes to prevent Render Free Tier from sleeping (15 min inactivity timeout)
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Check
        run: |
          BACKEND_URL="${{ secrets.RENDER_BACKEND_URL || 'https://samudra3d.onrender.com' }}"
          echo "Pinging $BACKEND_URL/health..."
          
          # Perform HTTP request with timeout and output response
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" --max-time 60 "$BACKEND_URL/health")
          
          echo "HTTP Status: $HTTP_STATUS"
          cat response.json || true
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Backend is warm and healthy!"
          else
            echo "⚠️ Backend returned status $HTTP_STATUS or timed out (may be cold starting)."
          fi
